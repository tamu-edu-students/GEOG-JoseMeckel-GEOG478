<!DOCTYPE html>
<html>
    <head>
        <title>JoseMeckel TAMU Map</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
        <style>
            body {
                padding: 0;
                margin: 0;
            }
            html, body, #map {
                height: 100%;
                width: 100vw;
            }
            .info {
                padding: 6px 8px;
                font: 14px/16px Arial, Helvetica, sans-serif;
                background: white;
                background: rgba(255,255,255,0.8);
                box-shadow: 0 0 15px rgba(0,0,0,0.2);
                border-radius: 5px;
            }
            .info h4 {
                margin: 0 0 5px;
                color: #777;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script src="tamubuildings.js"></script> <!-- Include the external GeoJSON file -->
        <script>
            // Initialize the map and set its view to TAMU Campus
            var map = L.map('map').setView([30.615, -96.34], 16);

            // Add OpenStreetMap tiles
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            // Function to get the color for buildings
            function getColor() {
                return '#500000'; // Maroon color for TAMU buildings
            }

            // Style function for GeoJSON features
            function style(feature) {
                return {
                    fillColor: getColor(),
                    weight: 2,
                    opacity: 1,
                    color: 'white',
                    dashArray: '3',
                    fillOpacity: 0.7
                };
            }

            // Highlight feature on mouseover
            function highlightFeature(e) {
                var layer = e.target;

                layer.setStyle({
                    weight: 5,
                    color: '#666',
                    dashArray: '',
                    fillOpacity: 0.9
                });

                info.update(layer.feature.properties);
            }

            // Reset highlight on mouseout
            function resetHighlight(e) {
                geojson.resetStyle(e.target);
                info.update();
            }

            // Zoom to feature on click
            function zoomToFeature(e) {
                map.fitBounds(e.target.getBounds());
            }

            // Define interactions for each feature
            function onEachFeature(feature, layer) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight,
                    click: zoomToFeature
                });
            }

            // Add GeoJSON data to the map
            var geojson = L.geoJson(tamu, { // Use the variable from tamubuildings.js
                style: style,
                onEachFeature: onEachFeature
            }).addTo(map);

            // Custom info control
            var info = L.control();

            info.onAdd = function (map) {
                this._div = L.DomUtil.create('div', 'info');
                this.update();
                return this._div;
            };

            // Update info control based on feature properties
            info.update = function (props) {
                this._div.innerHTML = '<h4>BldgName and BldgAbbr</h4>' + 
                    (props ? '<b>' + props.BldgName + '</b><br />' + props.BldgAbbr
                           : 'Hover over a building');
            };

            info.addTo(map);
        </script>
    </body>
</html>
